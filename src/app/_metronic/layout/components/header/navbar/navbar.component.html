<div class="app-navbar-item" [ngClass]="itemClass">
  <div class="user-profile-badge d-flex align-items-center gap-3 cursor-pointer p-1 ps-3 pe-2 rounded-pill"
       data-kt-menu-trigger="{default: 'click'}"
       data-kt-menu-attach="parent"
       data-kt-menu-placement="bottom-end">
    
    <!-- User Name & Status -->
    <div class="d-flex flex-column text-end d-none d-sm-flex">
      <span class="user-name-text">{{ userDisplayName }}</span>
      <span class="user-role-text">
        <span class="online-indicator-dot"></span>
        {{ userRole }}
      </span>
    </div>

    <!-- Smart Modern Avatar Container -->
    <div class="modern-user-avatar-wrap position-relative">
      <img src="./assets/media/svg/avatars/001-boy.svg" alt="User Avatar" class="modern-user-avatar-img" />
      <span class="avatar-online-badge"></span>
    </div>
  </div>

  <app-user-inner class="padding-0" data-kt-menu='true'></app-user-inner>
</div>


<!-- Extra mobile header menu toggle removed as requested to keep only one single toggle button -->
