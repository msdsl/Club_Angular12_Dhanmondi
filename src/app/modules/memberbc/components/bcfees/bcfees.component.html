<div class="row">
  <div class="col-lg-8 col-md-12">
    <div class="form-section-card p-4 rounded-3 border mb-4">
      <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom border-gray-200">
        <div class="d-flex align-items-center gap-2">
          <i class="fas fa-receipt text-primary"></i>
          <h5 class="fw-bolder text-dark mb-0">Applicable Registration & Service Fees</h5>
        </div>
        <span class="badge badge-light-primary fs-9 fw-semibold">Fee Configuration</span>
      </div>

      <div class="table-responsive rounded-2 border">
        <table class="table table-hover align-middle mb-0 text-center">
          <thead class="table-head">
            <tr>
              <th class="w-50px">Select</th>
              <th class="w-60px">ID</th>
              <th class="text-start">Fee Title</th>
              <th class="text-end pe-4">Amount (BDT)</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let x of memberFeesData">
              <td><input type="checkbox" class="form-check-input smart-switch" [(ngModel)]="x.IsChecked" /></td>
              <td class="text-muted fs-8 fw-bold">{{ x.Id }}</td>
              <td class="text-start fw-bold text-dark">{{ x.Title }}</td>
              <td class="text-end pe-4 fw-bolder text-primary">{{ x.Amount | number:'1.2-2' }}</td>
            </tr>
            <tr *ngIf="!memberFeesData || memberFeesData.length === 0">
              <td colspan="4" class="p-3 text-muted">No fee records found</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end mt-4">
        <button type="button" class="primary-btn px-4" (click)="saveRegistrationFees()">
          <i class="fas fa-save me-2"></i> Save Fee Information
        </button>
      </div>
    </div>
  </div>
</div>
