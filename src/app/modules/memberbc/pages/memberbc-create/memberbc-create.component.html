<section>
  <div class="feature-section">
    <div class="feature-section-wrapper">
      <!-- Modern Page Header with Dynamic Title & ID Badge -->
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4 pb-3 border-bottom border-gray-200">
        <div class="d-flex align-items-center gap-3">
          <div class="member-header-icon">
            <i class="fas" [ngClass]="memberId ? 'fa-user-edit' : 'fa-user-plus'"></i>
          </div>
          <div>
            <div class="d-flex align-items-center gap-2 mb-1">
              <h3 class="fw-bolder text-dark mb-0">
                {{ memberId ? 'Edit Member Profile' : 'New Member Registration' }}
              </h3>
              <span *ngIf="memberId" class="badge-edit-id">
                ID #{{ memberId }}
              </span>
              <span *ngIf="!memberId" class="badge-new-pill">
                New Profile
              </span>
            </div>
            <p class="page-header-subtitle mb-0">
              Configure member credentials, personal records, family linkages, and subscription fees.
            </p>
          </div>
        </div>

        <div>
          <button type="button" class="action-outline-btn" (click)="goToListPage()">
            <i class="fas fa-arrow-left me-2"></i> Back to Member List
          </button>
        </div>
      </div>

      <!-- Modern Tab Navigation & Content Container -->
      <div class="card modern-tabs-card p-0 border border-gray-200 rounded-3 shadow-xs">
        <div class="card-header modern-tabs-header px-4 pt-3 pb-0 border-bottom border-gray-200">
          <ul class="nav nav-tabs modern-nav-tabs border-0" id="memberTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="nav-personal-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-personal"
                type="button"
                role="tab"
                aria-controls="nav-personal"
                aria-selected="true"
              >
                <i class="fas fa-user-circle me-2"></i> Personal Info
              </button>
            </li>
            <li class="nav-item" role="presentation" *ngIf="memberId">
              <button
                class="nav-link"
                id="nav-family-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-family"
                type="button"
                role="tab"
                aria-controls="nav-family"
                aria-selected="false"
              >
                <i class="fas fa-users me-2"></i> Family Details
              </button>
            </li>
            <li class="nav-item" role="presentation" *ngIf="memberId">
              <button
                class="nav-link"
                id="nav-fees-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-fees"
                type="button"
                role="tab"
                aria-controls="nav-fees"
                aria-selected="false"
              >
                <i class="fas fa-receipt me-2"></i> Fees & Subscriptions
              </button>
            </li>
            <li class="nav-item" role="presentation" *ngIf="memberId">
              <button
                class="nav-link"
                id="nav-ledger-tab"
                data-bs-toggle="tab"
                data-bs-target="#nav-ledger"
                type="button"
                role="tab"
                aria-controls="nav-ledger"
                aria-selected="false"
              >
                <i class="fas fa-book-open me-2"></i> Member Ledger
              </button>
            </li>
          </ul>
        </div>

        <div class="card-body p-4">
          <div class="tab-content" id="memberTabContent">
            <!-- Personal Info Tab -->
            <div
              class="tab-pane fade show active"
              id="nav-personal"
              role="tabpanel"
              aria-labelledby="nav-personal-tab"
            >
              <app-bcpersonal-info [memberId]="memberId"></app-bcpersonal-info>
            </div>

            <!-- Family Details Tab -->
            <div
              *ngIf="memberId"
              class="tab-pane fade"
              id="nav-family"
              role="tabpanel"
              aria-labelledby="nav-family-tab"
            >
              <app-bcfamily [memberId]="memberId"></app-bcfamily>
            </div>

            <!-- Fees & Subscriptions Tab -->
            <div
              *ngIf="memberId"
              class="tab-pane fade"
              id="nav-fees"
              role="tabpanel"
              aria-labelledby="nav-fees-tab"
            >
              <app-bcfees [memberId]="memberId"></app-bcfees>
            </div>

            <!-- Member Ledger Tab -->
            <div
              *ngIf="memberId"
              class="tab-pane fade"
              id="nav-ledger"
              role="tabpanel"
              aria-labelledby="nav-ledger-tab"
            >
              <app-bcmember-ledger [memberId]="memberId"></app-bcmember-ledger>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
