<section>
  <div class="feature-section">
    <div class="feature-section-wrapper">
      <div class="feature-list-header-wrapper">
        <div class="feature-list-header">
          <h3>Table List</h3>
        </div>
        <div>
          <span class="float-right">
            <button
              type="button"
              class="primary-btn"
              (click)="careateOrEditModalPopUp(createOrUpdateModal)"
            >
              + Add New
            </button>
          </span>
        </div>
      </div>
      <div class="feature-list-search-filter"></div>
      <form [formGroup]="searchForm">
        <div class="row">
          <div class="col-md-5 col-lg-4 col-xl-6">
            <div class="row">
              <div class="col-sm-12">
                <div class="d-flex justify-content-between align-items-center">
                  <label class="d-flex align-items-center gap-2">
                    <select
                      style="width: 5rem"
                      class="form-control mx-25 w-100px py-2 custom-select"
                      formControlName="pageSize"
                      (change)="filterData()"
                    >
                      <option value="5">5</option>
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                    </select>
                  </label>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-7 col-lg-8 col-xl-6">
            <div class="filter-search-option">
              <div class="input-group justify-content-end gap-3">
                <button
                  [ngClass]="{ hide: isFilter === false }"
                  type="button"
                  class="btn-filter"
                >
                  <i class="fas fa-filter filter-icon me-2"></i>
                </button>

                <div class="d-flex align-items-center position-relative w-50">
                  <app-keenicon
                    name="magnifier"
                    class="fs-3 search-input-icon"
                  ></app-keenicon>
                  <input
                    type="text"
                    data-action="filter"
                    class="form-control form-control-solid ps-12 search-input"
                    placeholder="Search ..."
                    formControlName="searchKey"
                    (keyup)="filterData()"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </form>

      <div class="content mt-2">
        <div class="table-responsive">
          <table class="mt-1 table table-hover mt-1 text-center">
            <thead class="table-head rounded-lg">
              <tr>
                <th class="w-55px">SL.</th>
                <th class="text-start">Title</th>
                <th class="text-start">Display Name</th>

                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor="let data of tableSetups; let i = index"
                (dblclick)="careateOrEditModalPopUp(createOrUpdateModal, data)"
              >
                <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
                <td class="text-start fw-bold text-dark">{{ data.Title || data.Name }}</td>
                <td class="text-start text-gray-700">{{ data.DisplayName || data.Title || '—' }}</td>

                <td class="w-100px text-center">
                  <div class="table-action-group">
                    <button
                      class="btn-table-action btn-table-edit"
                      title="Edit Item"
                      type="button"
                      (click)="careateOrEditModalPopUp(createOrUpdateModal, data)"
                    >
                      <i class="fas fa-edit"></i>
                    </button>
                    <button
                      class="btn-table-action btn-table-delete"
                      title="Delete Item"
                      type="button"
                      (click)="deleteButtonClick(data.Id)"
                    >
                      <i class="far fa-trash-alt"></i>
                    </button>
                  </div>
                </td>
              </tr>
            </tbody>
            <tbody *ngIf="tableSetups.length < 1 || hasData === false">
              <tr>
                <td colspan="4" class="p-0">
                  <app-empty [message]="'No Data Found'"></app-empty>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="row">
          <div class="col-sm-12">
            <ngb-pagination
              class="d-flex justify-content-end"
              [collectionSize]="numberOfEntries"
              [(page)]="currentPage"
              [pageSize]="pageSize"
              (pageChange)="updatePageWiseTableData($event)"
              [boundaryLinks]="true"
              [maxSize]="4"
            >
            </ngb-pagination>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<ng-template #createOrUpdateModal let-modal>
  <div>
    <div class="modal-header">
      <h4 class="modal-title ml-1" id="myModalLabel160">
        {{ tableSetupForm.get('Id')?.value ? 'Edit Table Setup' : 'Create Table Setup' }}
      </h4>
      <button
        type="button"
        aria-label="Close"
        class="btn-close"
        (click)="modal.dismiss('Cross click')"
      ></button>
    </div>
  </div>
  <div class="px-4 py-3">
    <form [formGroup]="tableSetupForm">
      <div class="row g-3">
        <div class="col-md-12">
          <div class="form-group mb-3">
            <label for="name" class="form-label fw-bold fs-7 text-dark mb-2"
              >Table Title <span class="text-danger">*</span></label
            >
            <input
              type="text"
              formControlName="Title"
              id="name"
              class="form-control"
              placeholder="e.g. Table 01, VIP Dining 1"
              required
            />
            <small
              [hidden]="handleBlur(tableSetupForm.controls.Title)"
              class="text-danger"
            >
              Title is required
            </small>
          </div>
          <div class="form-group">
            <label for="displayName" class="form-label fw-bold fs-7 text-dark mb-2"
              >Display Name</label
            >
            <input
              type="text"
              formControlName="DisplayName"
              id="displayName"
              class="form-control"
              placeholder="e.g. T-01 (Terrace)"
            />
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="d-flex justify-content-end w-100 border-0 gap-2 modal-footer px-4 pb-4">
    <button type="button" class="discard-btn me-1" (click)="modal.dismiss('Cross click')">
      Discard
    </button>
    <button
      type="button"
      class="primary-btn"
      (click)="onSubmit()"
    >
      Submit
    </button>
  </div>
</ng-template>

<ng-template #deleteConfirmation let-c="close" let-d="dismiss">
  <app-confirmation-modal
    text="Do You Confirm to delete this profession?"
    (closeButtonClicked)="d('Cross click')"
    (okButtonClicked)="deleteButtonClick()"
  ></app-confirmation-modal>
</ng-template>

<swal #noticeSwal [swalOptions]="swalOptions"> </swal>

<swal
  #deleteSwal
  title="Are you sure to delete?"
  text="This cannot be undone"
  icon="warning"
  [showCancelButton]="true"
  [focusCancel]="true"
  (confirm)="triggerDelete()"
  [customClass]="{
    confirmButton: 'btn btn-danger',
    cancelButton: 'btn btn-active-light'
  }"
>
</swal>
