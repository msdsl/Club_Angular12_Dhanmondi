
<div>
  <div class="modal-header">
    <h4 class="modal-title ml-1" id="myModalLabel160">Venue List</h4>
    <button
      type="button"
      aria-label="Close"
      class="btn-close"
      (click)="closeModal()"
    ></button>
  </div>
</div>
<div class="modal-body">
  <p>Selected Date : {{ selectedDate }}</p>
  <form>
    <div class="row">
      <div class="col-md-12 col-12">
        <div style="display: flex; gap: 0.3rem; margin-left: 0.6rem; margin-bottom: 0.8rem">
          <input
            type="checkbox"
            [(ngModel)]="isAllVenuChecked"
            name="selectALL"
            id="selectALL"
            (change)="handleAllVenueSelect()"
          />
          <span> Select All </span>
        </div>
        <table class="table table-bordered">
          <tr *ngFor="let x of venueList; let i = index">
            <td>
              <input
                [(ngModel)]="x.IsChecked"
                (change)="handleVenueSelect(x)"
                type="checkbox"
                [name]="'VenueTitle_' + x.VenueId + i"
                id="VenueTitle"
              />
              <span>
                {{ x.VenueTitle }}
              </span>
            </td>
            <td style="display: flex; justify-content: space-between">
              <div *ngFor="let x1 of x.VenueAvailableDetails; let i = index">
                <div *ngIf="x1.AvailableId > 0" style="display: flex; gap: 0.3rem; margin-right: 4rem">
                  <input
                    (change)="handleVenueAvailableSelect(x1)"
                    [(ngModel)]="x1.IsChecked"
                    type="checkbox"
                    [name]="'AreaLayoutTitle_' + x1.VenueId + i"
                    id="AvailableText"
                  />
                  <span>
                    {{ x1.AvailableText }}
                  </span>
                </div>
              </div>
            </td>
          </tr>
        </table>
        <!-- <ng-select
          [items]=""
          bindLabel="Title"
          bindValue="Id"
          name="Title"
          formControlName="VenueId"
        ></ng-select> -->
      </div>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="discard-btn me-1" (click)="closeModal()">Close</button>
  <button type="button" class="primary-btn" (click)="saveEvent()">Save</button>
</div>
