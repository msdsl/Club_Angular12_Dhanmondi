<div class="py-2">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h5 class="fw-bold text-dark mb-1">Assign User Roles</h5>
      <p class="section-subtitle mb-0">Select the roles to grant this user corresponding system permissions</p>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-6 col-lg-4" *ngFor="let x1 of rolePermissionList; index as i">
      <div class="role-card" [class.role-card-active]="x1.IsChecked" (click)="toggleCheckBoxUserRole(x1)">
        <div class="d-flex align-items-center justify-content-between gap-3">
          <div class="d-flex align-items-center gap-3">
            <div class="role-icon-box" [class.role-icon-box-active]="x1.IsChecked">
              <i class="fas fa-shield-alt"></i>
            </div>
            <div>
              <div class="fw-bold text-dark fs-7">{{ x1.RoleName }}</div>
              <span class="fs-8 text-muted">{{ x1.IsChecked ? 'Granted' : 'Revoked' }}</span>
            </div>
          </div>
          <input
            type="checkbox"
            class="form-check-input smart-switch"
            [checked]="x1.IsChecked"
            (click)="$event.stopPropagation()"
            (change)="toggleCheckBoxUserRole(x1)"
          />
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end align-items-center pt-3 border-top border-gray-200">
    <button type="button" class="primary-btn" (click)="saveUserRole()">
      <i class="fas fa-save me-1"></i> Save Role Assignments
    </button>
  </div>
</div>
