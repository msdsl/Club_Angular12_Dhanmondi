<div class="py-2">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h5 class="fw-bold text-dark mb-1">User Activity Logs</h5>
      <p class="section-subtitle mb-0">Audit history and timestamped actions performed on or by this account</p>
    </div>
  </div>

  <div class="table-responsive rounded-3 border border-gray-200" *ngIf="userLogData && userLogData.length > 0; else noLogs">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-head">
        <tr>
          <th class="w-55px text-center">SL.</th>
          <th style="min-width: 180px">Date & Time</th>
          <th>Activity Log Details</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let x of userLogData; index as i">
          <td class="text-center fw-bold text-muted">{{ i + 1 }}</td>
          <td>
            <span class="badge badge-light-primary fw-bold fs-8">
              <i class="far fa-clock me-1"></i> {{ x.LogDate | date: 'medium' }}
            </span>
          </td>
          <td class="fw-semibold text-dark fs-7">
            <i class="fas fa-history text-primary me-2 opacity-75"></i>
            {{ x.LogText }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #noLogs>
    <div class="text-center py-5 bg-light rounded-3 border border-dashed border-gray-300">
      <i class="fas fa-clipboard-list fs-2x text-muted mb-3 d-block"></i>
      <p class="text-muted fw-semibold fs-7 mb-0">No activity logs recorded for this user yet.</p>
    </div>
  </ng-template>
</div>
